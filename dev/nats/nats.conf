# Dev NATS server (ADR-0011 B1, B8). Listens inside the compose network and on
# 127.0.0.1 only (see compose.yaml). Users and permissions come from the
# generated accounts.conf (public nkeys only; seeds never leave the generator's output dir).
server_name: hostry-dev
port: 4222
http: 8222

jetstream {
  store_dir: /data
  max_memory_store: 64MB
  max_file_store: 4GB
}

include accounts.conf
